services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:5173
    ports:
      - '5173:3000'
    environment:
      API_URL: http://host.docker.internal:3000/api/v1
    extra_hosts:
      - 'host.docker.internal:host-gateway'
